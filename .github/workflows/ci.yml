name: CI - Tests, Analysis, Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.19.0"
  API_URL: http://10.0.2.2:3000

jobs:

  security-scan:
    name: Security Scan (Semgrep & Detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
      - name: Helper - Create dummy Detekt config
        run: echo "" > detekt-config.yml
      - name: Run Detekt (Kotlin Static Analysis)
        # We run detekt only on android folder
        run: cd android && ./gradlew detekt || true

  golden-tests:
    name: Golden Tests (Generated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Golden Tests
        # Runs tests and updates goldens (or fails if mismatch without update flag)
        # For CI validation usually we run without update and fail on mismatch.
        # But for 'generation' logic we might want to fail if changed or upload artifacts.
        # Here we just run and upload if failures.
        run: flutter test integration_test/golden_tests/screenshot_test.dart
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: integration_test/golden_tests/failures/

  analyze:
    name: Dart Analyzer & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dart format check
        run: |
          dart format --set-exit-if-changed .
      - name: Dart analyze
        run: flutter analyze

  unit-tests:
    name: Flutter unit & widget tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Run unit & widget tests
        run: flutter test --coverage
      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  android-tests:
    name: Android Instrumentation Matrix
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        api-level: [29, 31]
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install mock server deps
        working-directory: server
        run: npm install
      - name: Start Node Mock Server
        working-directory: server
        run: nohup node upload_server.js > mock_server.log 2>&1 & echo "Mock server started"
      
      - name: Add retry script
        run: |
          cat << 'EOF' > retry.sh
          #!/usr/bin/env bash
          set -e
          cmd="$@"
          max=3
          count=1
          until $cmd; do
            if [ $count -ge $max ]; then
              echo "❌ Command failed after $max attempts: $cmd"
              exit 1
            fi
            echo "⚠️ Attempt $count failed. Retrying..."
            count=$((count+1))
            sleep 5
          done
          EOF
          chmod +x retry.sh

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # Health Checks
            adb wait-for-device
            adb shell "getprop sys.boot_completed" 
            adb shell "dumpsys battery"
            adb shell "logcat -G 10M"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            
            # Run Tests with Retry
            ./retry.sh ./gradlew connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.eatzy.eatzy_vendor
            # Run Jacoco Report
            ./gradlew jacocoTestReport

      - name: Dump logcat on failure
        if: failure()
        run: adb logcat -d > logcat.txt

      - name: Upload Jacoco Android coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: android/app/build/reports/jacoco/jacocoTestReport/xml/report.xml
          flags: android
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs-api-${{ matrix.api-level }}
          path: |
            server/mock_server.log
            android/app/build/reports/
            /home/runner/.android/avd/*
            logcat.txt

  integration:
    name: Integration Tests (Drive) + Artifacts
    runs-on: ubuntu-latest
    needs: android-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install mock server deps
        working-directory: server
        run: npm install
      - name: Start Node Mock Server
        working-directory: server
        run: nohup node upload_server.js > mock_server.log 2>&1 & echo "Mock server started"

      - name: Add retry script
        run: |
          cat << 'EOF' > retry.sh
          #!/usr/bin/env bash
          set -e
          cmd="$@"
          max=3
          count=1
          until $cmd; do
            if [ $count -ge $max ]; then
              echo "❌ Command failed after $max attempts: $cmd"
              exit 1
            fi
            echo "⚠️ Attempt $count failed. Retrying..."
            count=$((count+1))
            sleep 5
          done
          EOF
          chmod +x retry.sh

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -noaudio -no-boot-anim -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # Health Check
            adb wait-for-device
            adb shell "getprop sys.boot_completed"
            
            flutter pub get
            ./retry.sh flutter drive --driver=test_driver/integration_driver.dart --target=integration_test/item_upload_e2e_test.dart --dart-define=EATZY_API_BASE_URL=${API_URL}

      - name: Dump logcat on failure
        if: failure()
        run: adb logcat -d > logcat.txt

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            server/mock_server.log
            build/**
            logcat.txt
